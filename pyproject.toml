[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "s7-tag-extractor"
version = "0.1.0"
description = "Extract tags from Siemens Step 7 projects for PI Builder and Kepware"
requires-python = ">=3.9"
dependencies = [
    "dbfread>=2.0.7",
    "click>=8.0",
    "openpyxl>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
